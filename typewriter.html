<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literature Clock — Typewriter</title>
<meta name="description" content="A literary clock: time told through quotes from classic literature, displayed on a vintage typewriter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #100c07;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: radial-gradient(ellipse 80% 70% at 50% 65%, #241508 0%, #100c07 100%);
  font-family: 'Special Elite', 'American Typewriter', 'Courier New', monospace;
}

/* ── Layout ── */

.scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
  gap: 0;
}

.typewriter-wrap {
  position: relative;
  width: min(900px, 96vw);
  aspect-ratio: 900 / 760; /* explicit height so child % values resolve correctly */
}

.typewriter-svg {
  width: 100%;
  height: auto;
  display: block;
  /* SVG viewBox is 900 × 760 (y: -160 → 600) */
}

/* ── Paper overlay ──
   SVG viewBox: 0 -160 900 760  (visible y range: -160 to 600)
   Paper x=185 w=530; platen top arc y=220
   Platen top relative to viewBox: (220 − (−160)) / 760 = 380/760 = 50%
   So overlay runs from top:0 to bottom:50% (= exactly the platen line)
*/
.paper-overlay {
  position: absolute;
  left: 20.56%;
  top: 0;
  width: 58.89%;
  bottom: 50%;
  overflow: hidden;
  pointer-events: none;
  font-size: clamp(10px, 1.35vw, 14px); /* em base for children and background-size */
  /* subtle horizontal rules matching line height */
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(1.6em - 1px),
    rgba(160, 140, 110, 0.12) calc(1.6em - 1px),
    rgba(160, 140, 110, 0.12) 1.6em
  );
  background-size: 100% 1.6em;
  background-position: 0 0.1em;
}

/* Anchor to the bottom of the overlay so text grows upward as quotes accumulate.
   bottom: 1.8em reserves one blank line above the platen so the last typed
   line never runs into the ribbon/bail area. */
.paper-lines-container {
  position: absolute;
  bottom: 1.8em;
  left: 36px;
  right: 36px;
  /* paper-advance animation target */
}

.paper-lines-container.advancing {
  animation: paperAdvance 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@keyframes paperAdvance {
  0%   { transform: translateY(0); }
  30%  { transform: translateY(-13px); }
  65%  { transform: translateY(-13px); }
  100% { transform: translateY(0); }
}

/* ── Paper lines ── */

.paper-line {
  font-family: 'Special Elite', 'American Typewriter', 'Courier New', monospace;
  line-height: 1.6;
  color: #1e1509;
  word-break: break-word;
  transition: opacity 0.4s ease;
}

.paper-line.old   { opacity: 0.38; }
.paper-line.older { opacity: 0.18; }

.paper-line em {
  font-style: normal;
  text-decoration: underline;
  text-decoration-style: wavy;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  text-decoration-color: rgba(30, 21, 9, 0.55);
}


/* ── Cursor ── */
.cursor {
  display: inline;
  animation: cursorBlink 0.75s step-end infinite;
  opacity: 1;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* ── Status bar ── */
.status-bar {
  margin-top: -2px;
  font-family: 'Special Elite', 'Courier New', monospace;
  font-size: clamp(9px, 1vw, 11px);
  color: rgba(210, 175, 115, 0.3);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  height: 1.6em;
  line-height: 1.6em;
  pointer-events: none;
}

/* ── Loading dots ── */
.loading-text { opacity: 0.5; font-style: italic; }
</style>
</head>
<body>
<div class="scene">
  <div class="typewriter-wrap">

    <!-- ════════════════════════════════════════════════
         SVG TYPEWRITER ILLUSTRATION
         ViewBox: 900 × 700
         ════════════════════════════════════════════════ -->
    <!-- ════════════════════════════════════════════════

         ViewBox: 900 × 760 (y: -160 → 600)
         ════════════════════════════════════════════════ -->
    <svg class="typewriter-svg" viewBox="0 -160 900 760"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Body gradient: glossy black lacquer with volumetric reflection -->

          <stop offset="8%"   stop-color="#242429"/>
          <stop offset="35%"  stop-color="#0f0f12"/>

          <stop offset="90%"  stop-color="#18181c"/>
          <stop offset="100%" stop-color="#020203"/>
        </linearGradient>
        
        <!-- Horizontal body gradient for side panels and wrappers -->
        <linearGradient id="gBodyH" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#060609"/>
          <stop offset="15%"  stop-color="#222227"/>
          <stop offset="35%"  stop-color="#3c3c43"/>
          <stop offset="55%"  stop-color="#161619"/>
          <stop offset="85%"  stop-color="#09090b"/>
          <stop offset="100%" stop-color="#010102"/>
        </linearGradient>
        
        <!-- Carriage gradient: high-density steel -->
        <linearGradient id="gCarriage" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4d4d54"/>
          <stop offset="30%"  stop-color="#2d2d33"/>
          <stop offset="70%"  stop-color="#18181c"/>

        </linearGradient>
        
        <!-- Platen: vulcanized black rubber cylinder -->
        <linearGradient id="gPlaten" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4c4c54"/>
          <stop offset="20%"  stop-color="#27272b"/>
          <stop offset="75%"  stop-color="#131316"/>
          <stop offset="100%" stop-color="#0a0a0c"/>
        </linearGradient>
        
        <!-- Chrome hardware: highly reflective sky/ground metallic gradients -->
        <linearGradient id="gChrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="18%"  stop-color="#dedede"/>
          <stop offset="38%"  stop-color="#a3a3a8"/>
          <stop offset="47%"  stop-color="#48484a"/>
          <stop offset="50%"  stop-color="#121214"/>
          <stop offset="53%"  stop-color="#808084"/>
          <stop offset="82%"  stop-color="#f2f2f5"/>
          <stop offset="100%" stop-color="#939399"/>
        </linearGradient>
        
        <!-- Chrome horizontal reflection -->
        <linearGradient id="gChromeH" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#808084"/>
          <stop offset="20%"  stop-color="#f2f2f5"/>
          <stop offset="45%"  stop-color="#ffffff"/>
          <stop offset="50%"  stop-color="#121214"/>
          <stop offset="55%"  stop-color="#939399"/>
          <stop offset="80%"  stop-color="#dedede"/>
          <stop offset="100%" stop-color="#48484a"/>
        </linearGradient>
        
        <!-- Gold foil decal gradient for Remington branding -->
        <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">

          <stop offset="30%"  stop-color="#e3be47"/>

          <stop offset="90%"  stop-color="#85610b"/>

        </linearGradient>
        
        <!-- Platen knob metal gradient -->
        <radialGradient id="gKnob" cx="35%" cy="30%" r="65%">

          <stop offset="30%"  stop-color="#dcdcdf"/>

        </radialGradient>
        
        <!-- spherical keycaps -->

          <stop offset="68%"  stop-color="#141822"/>
          <stop offset="92%"  stop-color="#050810"/>

        </radialGradient>
        
        <radialGradient id="gRedKey" cx="35%" cy="30%" r="65%">

          <stop offset="25%"  stop-color="#ef4444"/>

          <stop offset="92%"  stop-color="#570c0c"/>

        <!-- Key well depth shading -->

        </linearGradient>
 
        <!-- Paper: warm deckled cream -->

          <stop offset="4%"   stop-color="#fefcf8"/>
          <stop offset="96%"  stop-color="#fefcf8"/>
          <stop offset="100%" stop-color="#d4c9b3"/>
        </linearGradient>
        
        <!-- Typewriter drop shadow -->
        <filter id="fShadow" x="-12%" y="-8%" width="124%" height="128%">

          <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.75"/>
        </filter>
      </defs>

      <!-- ── Whole machine with drop shadow ── -->

        </g>

        <rect x="185" y="-400" width="4"   height="686" fill="#c3baa6" opacity="0.8"/>
        <rect x="711" y="-400" width="4"   height="686" fill="#c3baa6" opacity="0.8"/>

        <!-- ── Paper guide fingers (chrome clips) ── -->
        <g filter="url(#fShadow)">
          <rect x="200" y="35" width="14" height="190" rx="7" fill="url(#gChrome)" stroke="#111827" stroke-width="0.8"/>
          <rect x="196" y="29" width="22" height="20"  rx="5" fill="url(#gChrome)" stroke="#111827" stroke-width="0.8"/>
          <circle cx="207" cy="39" r="4" fill="#111827"/>
        </g>
        <g filter="url(#fShadow)">
          <rect x="686" y="35" width="14" height="190" rx="7" fill="url(#gChrome)" stroke="#111827" stroke-width="0.8"/>
          <rect x="682" y="29" width="22" height="20"  rx="5" fill="url(#gChrome)" stroke="#111827" stroke-width="0.8"/>

        </g>

        <!-- ═══════════════════════════════════

              stroke="#b91c1c" stroke-width="0.8" opacity="0.8"/>
        <!-- center marker -->

<script>
// ============================================================
//  LITERATURE CLOCK — TYPEWRITER WEB
//  Quote data: github.com/JohannesNE/literature-clock
// ============================================================

const CSV_URL =
  'https://raw.githubusercontent.com/JohannesNE/literature-clock/master/litclock_annotated.csv';

const CHAR_DELAY_BASE = 38;   // ms per character, base
const CHAR_DELAY_JITTER = 44; // random extra ms
const ADVANCE_DELAY = 600;    // ms for paper-advance animation
const MAX_OLD_LINES = 3;      // non-current quote blocks to keep

let quotesMap = {};           // { 'HH:MM': [ {time, quote, source}, ... ] }
let typingTimer = null;
let clockStarted = false;
let pendingAdvanceTimer = null;

// ── Generate QWERTY key caps with chrome bezels and serif lettering ────────────────

(function generateKeys() {
  const rows = [
    { y: 352, x0: 92,  dx: 56.5, keys: ["2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "½", "¼", "←"] },
    { y: 406, x0: 120, dx: 56.5, keys: ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "¢", "¾", "STARTER"] },
    { y: 459, x0: 148, dx: 56.5, keys: ["LOCK", "A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "↩"] },
    { y: 512, x0: 175, dx: 56.5, keys: ["SHIFT", "Z", "X", "C", "V", "B", "N", "M", ",", ".", "SHIFT"] }
  ];

  let svg = '';
  for (const row of rows) {
    for (let i = 0; i < row.keys.length; i++) {
      const char = row.keys[i];
      const x = row.x0 + i * row.dx;
      const y = row.y;
      
      let fillKey = 'url(#gBlackKey)';
      let textColor = '#fdfbf7';
      let fontSize = '13.5px';
      
      if (char === 'STARTER') {
        fillKey = 'url(#gRedKey)';
        textColor = '#ffffff';
        fontSize = '7.5px';
      } else if (char === 'SHIFT' || char === 'LOCK') {
        fillKey = 'url(#gGrayKey)';
        fontSize = '8px';
      }
      
      // Chrome metal vertical key plunger stem
      svg += `<rect x="${x - 2.5}" y="${y}" width="5" height="30" fill="url(#gChrome)" stroke="#111827" stroke-width="0.5"/>`;
      svg += `<rect x="${x - 1.5}" y="${y}" width="1" height="30" fill="#ffffff" opacity="0.4"/>`;

      // Outer bezel base shadow
      svg += `<circle cx="${x}" cy="${y + 2.5}" r="21" fill="#000" opacity="0.4"/>`;
      // Chrome metal ring outer ring
      svg += `<circle cx="${x}" cy="${y}" r="21" fill="url(#gChrome)" stroke="#4b5563" stroke-width="0.5"/>`;
      // Chrome metal ring inner ring
      svg += `<circle cx="${x}" cy="${y}" r="19.5" fill="#09090b"/>`;
      // Concentric inner ring for 3D bezel look
      svg += `<circle cx="${x}" cy="${y}" r="18.5" fill="none" stroke="#374151" stroke-width="1"/>`;
      // Keycap center background
      svg += `<circle cx="${x}" cy="${y}" r="17.2" fill="${fillKey}"/>`;
      
      // Text label inside the keycap
      if (char === 'STARTER') {
        svg += `<text x="${x}" y="${y - 1.5}" text-anchor="middle" font-family="'Special Elite', 'Georgia', serif" font-weight="bold" font-size="6px" fill="${textColor}">SELF</text>`;
        svg += `<text x="${x}" y="${y + 5.5}" text-anchor="middle" font-family="'Special Elite', 'Georgia', serif" font-weight="bold" font-size="6px" fill="${textColor}">STARTER</text>`;
      } else {
        svg += `<text x="${x}" y="${y + 4.5}" text-anchor="middle" font-family="'Special Elite', 'Georgia', serif" font-weight="bold" font-size="${fontSize}" fill="${textColor}">${char}</text>`;
      }
      
      // Spherical glass reflections
      svg += `<ellipse cx="${x - 4}" cy="${y - 4}" rx="8" ry="4.5" fill="rgba(255, 255, 255, 0.16)"/>`;
      svg += `<path d="M ${x - 11} ${y + 8} A 13.5 13.5 0 0 0 ${x + 11} ${y + 8}" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>`;
    }
  }
  document.getElementById('keyGroup').innerHTML = svg;
})();

// ── CSV fetch & parse ─────────────────────────────────────────

async function loadCSV() {
  startLoadingAnimation();
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    parseCSV(text);
    startClock();
  } catch (err) {
    console.error('Literature clock load failed:', err);
    showLoadError();
  }
}

function parseCSV(text) {
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    // Format: time|time_natural|quote|title|author
    const p = line.split('|');
    if (p.length < 4) continue;
    const time   = p[0].trim();
    const quote  = p[2].trim();
    const title  = (p[3] || '').trim();
    const author = (p[4] || '').trim();
    if (!/^\d{2}:\d{2}$/.test(time) || !quote) continue;
    const source = author ? `${title} — ${author}` : title;
    if (!quotesMap[time]) quotesMap[time] = [];
    quotesMap[time].push({ time, quote, source });
  }
}

// ── Clock management ──────────────────────────────────────────

function startClock() {
  clockStarted = true;
  // Clear loading state before first quote
  document.getElementById('paperContainer').innerHTML = '';
  showCurrentQuote();

  // Fire again at the next exact minute boundary
  const now = new Date();
  const msToNextMinute =
    (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

  setTimeout(() => {
    showCurrentQuote();
    setInterval(showCurrentQuote, 60_000);
  }, msToNextMinute);
}

function timeKey(d = new Date()) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function pickQuote(key) {
  const list = quotesMap[key];
  if (!list || !list.length) return null;
  return list[Math.floor(Math.random() * list.length)];
}

function showCurrentQuote() {
  if (document.hidden) return;
  const key   = timeKey();
  const quote = pickQuote(key);
  updateStatusBar(key);
  if (quote) advancePaper(quote);
}

// ── Paper advance + typing ────────────────────────────────────

function advancePaper(quoteObj) {
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
  if (pendingAdvanceTimer) { clearTimeout(pendingAdvanceTimer); pendingAdvanceTimer = null; }

  const container = document.getElementById('paperContainer');

  // Animate the paper feeding up
  container.classList.add('advancing');
  container.addEventListener('animationend', () => {
    container.classList.remove('advancing');
  }, { once: true });

  // After animation starts, age the existing lines and add new one
  pendingAdvanceTimer = setTimeout(() => {
    pendingAdvanceTimer = null;
    if (document.hidden) return;
    ageLines(container);
    typeQuote(quoteObj, container);
  }, ADVANCE_DELAY);
}

function ageLines(container) {
  // current → old
  container.querySelectorAll('.paper-line.current').forEach(el => {
    el.classList.remove('current');
    el.classList.add('old');
  });
  // old → older (dimmer still)
  container.querySelectorAll('.paper-line.old').forEach(el => {
    el.classList.add('older');
  });
  // Prune: keep only MAX_OLD_LINES aged block pairs
  pruneOldLines(container);
}

function pruneOldLines(container) {
  const lines = Array.from(
    container.querySelectorAll('.paper-line:not(.current)')
  );
  if (lines.length > MAX_OLD_LINES * 2) {
    const excess = lines.length - MAX_OLD_LINES * 2;
    for (let i = 0; i < excess; i++) lines[i].remove();
  }
}

function typeQuote(quoteObj, container) {
  const segments  = parseSegments(quoteObj.quote);
  const totalLen  = segments.reduce((s, seg) => s + seg.text.length, 0);

  const lineEl = document.createElement('div');
  lineEl.className = 'paper-line current';
  lineEl.innerHTML = '<span class="cursor">|</span>';
  container.appendChild(lineEl);

  let pos = 0;

  function tick() {
    if (document.hidden) {
      lineEl.innerHTML = buildHtml(segments, pos);
      typingTimer = null;
      return;
    }
    if (pos > totalLen) {
      lineEl.innerHTML = buildHtml(segments, totalLen);
      typingTimer = null;
      return;
    }
    lineEl.innerHTML =
      buildHtml(segments, pos) + '<span class="cursor">|</span>';
    pos++;
    const delay = CHAR_DELAY_BASE + Math.random() * CHAR_DELAY_JITTER;
    typingTimer = setTimeout(tick, delay);
  }

  tick();
}

// ── Segment helpers ───────────────────────────────────────────

function parseSegments(html) {
  html = html.replace(/<br\s*\/?>/gi, ' ');
  const segments = [];
  const re = /<em>([\s\S]*?)<\/em>/g;
  let last = 0, m;
  while ((m = re.exec(html)) !== null) {
    if (m.index > last)
      segments.push({ text: html.slice(last, m.index), em: false });
    segments.push({ text: m[1], em: true });
    last = m.index + m[0].length;
  }
  if (last < html.length)
    segments.push({ text: html.slice(last), em: false });
  return segments;
}

function buildHtml(segments, charCount) {
  let html = '', rem = charCount;
  for (const seg of segments) {
    if (rem <= 0) break;
    const slice   = seg.text.slice(0, rem);
    const escaped = slice
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    html += seg.em ? `<em>${escaped}</em>` : escaped;
    rem -= seg.text.length;
  }
  return html;
}

// ── UI helpers ────────────────────────────────────────────────

function updateStatusBar(key) {
  const bar = document.getElementById('statusBar');
  if (!bar) return;
  const [hStr, mStr] = key.split(':');
  const h    = parseInt(hStr, 10);
  const h12  = ((h + 11) % 12 + 1);
  const ampm = h < 12 ? 'AM' : 'PM';
  bar.textContent = `${h12}:${mStr} ${ampm}`;
}

let loadDotsTimer;
function startLoadingAnimation() {
  const dots = document.getElementById('loadDots');
  if (!dots) return;
  let n = 1;
  loadDotsTimer = setInterval(() => {
    dots.textContent = '…'.padEnd(n, '.');  // subtle
    n = (n % 3) + 1;
  }, 500);
}

function showLoadError() {
  clearInterval(loadDotsTimer);
  const container = document.getElementById('paperContainer');
  container.innerHTML =
    '<div class="paper-line current">— connection error —</div>';
}

// ── Visibility: pause when hidden, resume when visible ────────

function pauseTyping() {
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
  if (pendingAdvanceTimer) { clearTimeout(pendingAdvanceTimer); pendingAdvanceTimer = null; }
  // Finalize any in-progress line — strip cursor, freeze at current chars
  document.querySelectorAll('.cursor').forEach(el => el.remove());
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseTyping();
  } else if (clockStarted) {
    showCurrentQuote();
  }
});

// ── Boot ──────────────────────────────────────────────────────

loadCSV();
</script>
